/* ---------- resumen semanal ---------- */
function generarResumen(){
  const base = S.ui.fecha, dw = dowNum(base);
  const lunes = addDias(base, dw===0 ? -6 : 1-dw);
  const dias = []; for(let i=0;i<7;i++) dias.push(addDias(lunes,i));
  const hoy = hoyISO();
  const activos = dias.filter(f=> f<=hoy);

  const regs = activos.map(f=>({f, t:totalDia(f), d:S.log[f], obj:S.plan.objetivos[dia(f).tipo], tipo:dia(f).tipo}));
  const conD = regs.filter(r=>r.t.kcal>0);
  const mk = conD.length ? conD.reduce((a,b)=>a+b.t.kcal,0)/conD.length : 0;
  const mp = conD.length ? conD.reduce((a,b)=>a+b.t.p,0)/conD.length : 0;
  const desv = conD.length ? conD.reduce((a,b)=>a+(b.t.kcal-b.obj.kcal),0)/conD.length : 0;
  const pasosArr = regs.filter(r=>r.d&&r.d.pasos!=null).map(r=>r.d.pasos);
  const mpa = pasosArr.length ? pasosArr.reduce((a,b)=>a+b,0)/pasosArr.length : 0;
  const cumplePasos = pasosArr.filter(p=>p>=S.plan.pasosObjetivo).length;
  const comOK = regs.reduce((a,r)=>a+comidasRegistradas(r.f),0);
  const comTot = regs.reduce((a,r)=>a+comidasTotales(r.f),0);

  let L = [];
  L.push(`*${S.plan.cliente} · semana ${fechaLarga(lunes)} – ${fechaLarga(dias[6])}*`);
  L.push("");
  L.push("*NUTRICIÓN*");
  L.push(`· Días registrados: ${conD.length}/${activos.length}`);
  L.push(`· Adherencia comidas: ${comTot?r0(comOK/comTot*100):0} % (${comOK}/${comTot})`);
  L.push(`· Media kcal: ${r0(mk)} (objetivo medio ${r0(conD.length?conD.reduce((a,b)=>a+b.obj.kcal,0)/conD.length:0)}) → ${desv>=0?"+":""}${r0(desv)} kcal/día`);
  L.push(`· Media proteína: ${r0(mp)} g`);
  const dd = regs.map(r=> r.t.kcal ? `${DIAS_SEM[dowNum(r.f)].slice(0,2).toUpperCase()} ${r0(r.t.kcal)}` : null).filter(Boolean);
  if(dd.length) L.push(`· Por día: ${dd.join(" · ")}`);
  L.push("");
  L.push("*PASOS*");
  L.push(pasosArr.length ? `· Media ${r0(mpa).toLocaleString("es-ES")} · objetivo cumplido ${cumplePasos}/${pasosArr.length} días` : "· Sin registros");
  if(S.plan.peso){
    const P = S.plan.peso, m0 = mediaPeso(base,0), rt = ritmoPeso(base), ref = m0!=null?m0:ultimoPeso(base);
    L.push("");
    L.push("*PESO*");
    const def = esDeficit(), meta = pesoMeta();
    L.push(m0!=null ? `· Media de la semana: ${m0.toFixed(1).replace(".",",")} kg` : "· Sin pesajes esta semana");
    if(rt!=null) L.push(`· Ritmo: ${(rt>=0?"+":"−")}${Math.abs(rt).toFixed(2).replace(".",",")} kg/semana (objetivo ${def?"−":""}${String(P.ritmoObjetivo).replace(".",",")})`);
    if(ref!=null) L.push(`· Total desde ${String(P.inicial).replace(".",",")} kg: ${(ref-P.inicial>=0?"+":"−")}${Math.abs(ref-P.inicial).toFixed(1).replace(".",",")} kg · ${def?"falta hasta":"margen hasta"} ${meta} kg: ${Math.abs(meta-ref).toFixed(1).replace(".",",")} kg`);
    if(def){
      if(rt!=null && -rt > P.ritmoMax) L.push("· AVISO: baja más rápido de lo previsto, valorar subir 150-200 kcal");
      else if(rt!=null && m0!=null && -rt < (P.ritmoMin!=null?P.ritmoMin:0.05)) L.push("· AVISO: semana plana o al alza, revisar registro antes de tocar calorías");
    } else {
      if(rt!=null && rt > P.ritmoMax) L.push("· AVISO: ritmo por encima del máximo, valorar recorte de 150-200 kcal");
    }
  }
  if(S.plan.ansiedad){
    const A = S.plan.ansiedad;
    const eps = regs.flatMap(r => (r.d && Array.isArray(r.d.ansiedad) ? r.d.ansiedad.map(e=>({...e, f:r.f})) : []));
    L.push("");
    L.push("*ANSIEDAD*");
    if(!eps.length) L.push("· Ningún episodio apuntado esta semana");
    else {
      const sinComer = eps.filter(e=>e.salida && e.salida!=="comi").length;
      L.push(`· Episodios: ${eps.length} · resueltos sin comer: ${sinComer}/${eps.length}`);
      const porNivel = A.niveles.map(n=>`${n.txt.toLowerCase()} ${eps.filter(e=>e.nivel===n.id).length}`).join(" · ");
      L.push(`· Intensidad: ${porNivel}`);
      const cd = {}; eps.forEach(e=>{ if(e.disp) cd[e.disp]=(cd[e.disp]||0)+1; });
      const top = Object.keys(cd).sort((a,b)=>cd[b]-cd[a]).slice(0,3);
      if(top.length) L.push(`· Disparadores: ${top.map(t=>`${t} (${cd[t]})`).join(" · ")}`);
      eps.forEach(e=>{
        const niv = A.niveles.find(n=>n.id===e.nivel), sal = A.salidas.find(s=>s.id===e.salida);
        const det = [e.h||"?", niv?niv.txt.toLowerCase():"sin intensidad", e.disp||null, sal?sal.txt.toLowerCase():null].filter(Boolean).join(", ");
        L.push(`   – ${DIAS_SEM[dowNum(e.f)]} ${det}${e.nota&&e.nota.trim()?`: "${e.nota.trim()}"`:""}`);
      });
    }
  }
  const libres = regs.filter(r=>hayLibre(r.f));
  if(libres.length){
    L.push("");
    L.push("*COMIDAS LIBRES*");
    libres.forEach(r=>{
      const t = totalLibre(r.f);
      const sel = S.log[r.f].libre || {};
      const detalle = Object.keys(sel).map(id=>{
        const it = itemLibre(id); return it ? (sel[id]>1?sel[id]+"× ":"")+it.n : null;
      }).filter(Boolean).join(", ");
      L.push(`· ${DIAS_SEM[dowNum(r.f)]}: +${r0(t.kcal)} kcal estimadas (P${r0(t.p)} C${r0(t.hc)} G${r0(t.g)})`);
      if(detalle) L.push(`   – ${detalle}`);
      if(S.log[r.f].libreNota) L.push(`   – "${S.log[r.f].libreNota.trim()}"`);
    });
    const extra = libres.reduce((a,r)=>a+totalLibre(r.f).kcal,0);
    L.push(`· Total extra de la semana: +${r0(extra)} kcal ≈ ${(extra/7700).toFixed(2).replace(".",",")} kg de margen`);
  }
  L.push("");
  L.push("*CONTROL DEL PLAN*");
  const lim = contarLimites(base);
  const limS = (S.plan.limitesSemana || []);
  if(limS.length) L.push("· " + limS.map(l=>`${l.nombre} ${lim[l.id]}/${l.max}`).join(" · "));
  const hs = horariosPlan();
  if(hs){
    const cuenta = {};
    regs.forEach(r=>{ const k = (r.d && r.d.horario) || hs[0].id; cuenta[k] = (cuenta[k]||0)+1; });
    L.push("· Horario usado: " + hs.map(x=>`${x.nombre} ${cuenta[x.id]||0}`).join(" · "));
  }
  const rr = racha();
  if(rr) L.push(`· Racha de registro: ${rr} ${rr===1?"día seguido":"días seguidos"}`);
  const cenas = regs.filter(r=>r.d&&r.d.horaCena).map(r=>r.d.horaCena);
  if(cenas.length){
    const tardias = cenas.filter(x=>x >= S.plan.cena.tardeDesde).length;
    L.push(`· Cenas apuntadas: ${cenas.length} · tardías (${S.plan.cena.tardeDesde} o más): ${tardias}`);
  }
  const malas = [];
  regs.forEach(r=>{
    const s = r.d && r.d.sintomas; if(!s) return;
    Object.keys(s).forEach(mid=>{ if(s[mid]!=="bien"){
      const meal = (S.plan.dias[r.tipo]||[]).find(m=>m.id===mid);
      const sint = S.plan.sintomas.find(x=>x.id===s[mid]);
      const elegidos = [];
      Object.values((r.d.sel||{})[mid] || {}).forEach(v =>
        (Array.isArray(v)?v:[v]).forEach(f=>{ const ff=food(f); if(ff) elegidos.push(ff.n); }));
      malas.push(`   – ${DIAS_SEM[dowNum(r.f)]} ${meal?meal.nombre:mid}: ${sint?sint.txt.toLowerCase():""} (${elegidos.join(", ")||"sin detalle"})`);
    }});
  });
  if(malas.length){ L.push("· Digestiones regulares o malas: "+malas.length); L = L.concat(malas); }
  else if(regs.some(r=>r.d&&r.d.sintomas)) L.push("· Digestiones: sin incidencias");
  if(hayEntreno()){
  L.push("");
  L.push("*ENTRENAMIENTO*");
  let hubo=false;
  S.plan.entrenos.forEach(e=>{
    activos.forEach(f=>{
      const s = S.log[f] && S.log[f].entreno && S.log[f].entreno[e.id];
      if(!s) return;
      const lineas = e.ejercicios.map((ex,i)=>{
        const sets = (s[i]||[]).filter(x=>x&&x.reps);
        if(!sets.length) return null;
        return `   – ${ex.n}: ` + sets.map(x=>`${x.peso||"–"}×${x.reps}${x.rir!=null&&x.rir!==""?` (RIR ${x.rir})`:""}`).join(" · ");
      }).filter(Boolean);
      if(!lineas.length) return;
      hubo=true;
      const vol = e.ejercicios.reduce((a,ex,i)=>a+(s[i]||[]).reduce((b,x)=>b+((parseFloat(x&&x.peso)||0)*(parseFloat(x&&x.reps)||0)),0),0);
      L.push(`▸ ${e.nombre} · ${fechaLarga(f)} · volumen ${r0(vol).toLocaleString("es-ES")} kg`);
      L = L.concat(lineas);
    });
  });
  if(!hubo) L.push("· Sin sesiones registradas");
  }
  const notas = regs.filter(r=>r.d&&r.d.nota&&r.d.nota.trim());
  if(notas.length){
    L.push(""); L.push("*NOTAS*");
    notas.forEach(r=> L.push(`· ${fechaLarga(r.f)}: ${r.d.nota.trim()}`));
  }
  return L.join("\n");
}

/* =====================================================================
   EVENTOS
   ===================================================================== */
function toast(msg){
  const t=$("#toast"); t.textContent=msg; t.classList.add("on");
  clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove("on"),1900);
}
/* ¿este plan trae entrenamiento? Los clientes cuyo entreno lleva otro entrenador
   no ven la pestaña: el plan simplemente no declara "entrenos". */
function hayEntreno(){ return !!(S.plan.entrenos && S.plan.entrenos.length); }

function render(){
  if(S.ui.vista === "entreno" && !hayEntreno()) S.ui.vista = "hoy";
  const v = S.ui.vista;
  const btnEnt = $('nav button[data-v="entreno"]');
  if(btnEnt) btnEnt.classList.toggle("hidden", !hayEntreno());
  ["hoy","entreno","progreso","ajustes"].forEach(x=> $("#v-"+x).classList.toggle("hidden", x!==v));
  $$("nav button").forEach(b=> b.classList.toggle("on", b.dataset.v===v));
  $("#dateBar").classList.toggle("hidden", v==="ajustes");
  $("#tipoSw").classList.toggle("hidden", v!=="hoy");
  const d = dia(S.ui.fecha);
  $("#hdTitle").firstChild.textContent = {hoy:"Nutrición",entreno:"Entrenamiento",progreso:"Progreso",ajustes:"Plan"}[v];
  $("#hdSub").textContent = S.plan.cliente + " · " + S.plan.version;
  $("#dLabel").innerHTML = fechaLarga(S.ui.fecha) + `<span>${S.ui.fecha===hoyISO()?"hoy":""}</span>`;
  $$("#tipoSw button").forEach(b=> b.classList.toggle("on", b.dataset.t===d.tipo));
  if(v==="hoy") renderHoy();
  if(v==="entreno" && hayEntreno()) renderEntreno();
  if(v==="progreso") renderProgreso();
  if(v==="ajustes") renderAjustes();
}

document.addEventListener("click", e=>{
  const nav = e.target.closest("nav button");
  if(nav){ S.ui.vista = nav.dataset.v; render(); window.scrollTo(0,0); return; }

  if(e.target.closest("#dPrev")){ S.ui.fecha = addDias(S.ui.fecha,-1); render(); return; }
  if(e.target.closest("#dNext")){ S.ui.fecha = addDias(S.ui.fecha, 1); render(); return; }
  if(e.target.closest("#dToday")){ S.ui.fecha = hoyISO(); render(); return; }

  const tp = e.target.closest("#tipoSw button");
  if(tp){ dia(S.ui.fecha).tipo = tp.dataset.t; guardar(); render(); return; }

  const md = e.target.closest("[data-modo]");
  if(md){ const [mid,modo]=md.dataset.modo.split("|");
    const d=dia(S.ui.fecha); d.modos[mid]=modo; if(d.sel[mid]) delete d.sel[mid];
    guardar(); reRenderConservandoAbiertos(); return; }

  const op = e.target.closest("[data-sel]");
  if(op){
    const [mid,gid,fid,tipo] = op.dataset.sel.split("|");
    const cur = selDe(S.ui.fecha, mid, gid);
    if(tipo==="many"){
      let arr = Array.isArray(cur)?cur.slice():[];
      arr.includes(fid) ? arr.splice(arr.indexOf(fid),1) : arr.push(fid);
      setSel(S.ui.fecha, mid, gid, arr);
    } else {
      setSel(S.ui.fecha, mid, gid, cur===fid ? undefined : fid);
    }
    reRenderConservandoAbiertos(); return;
  }

  const ds = e.target.closest("[data-dia]");
  if(ds){ S.ui.diaEntreno = ds.dataset.dia; guardar(); renderEntreno(); window.scrollTo(0,0); return; }

  const rs = e.target.closest("[data-rest]");
  if(rs){ arrancarTimer(+rs.dataset.rest); return; }

  if(e.target.closest("#tStop")){ clearInterval(tInt); $("#timer").classList.remove("on"); return; }
  if(e.target.closest("#tAdd")){ tEnd += 30000; $("#timer").classList.remove("fin"); if(!tInt) tInt=setInterval(pintarTimer,250); pintarTimer(); return; }

  const lb = e.target.closest("[data-lib]");
  if(lb){
    const [id, dl] = lb.dataset.lib.split("|");
    const d = dia(S.ui.fecha); d.libre = d.libre || {};
    d.libre[id] = Math.max(0, (d.libre[id]||0) + (+dl));
    if(!d.libre[id]) delete d.libre[id];
    guardar(); reRenderConservandoAbiertos(); return;
  }
  if(e.target.closest("#btnLibreReset")){
    const d = dia(S.ui.fecha); d.libre = {};
    guardar(); toast("Comida libre vaciada"); reRenderConservandoAbiertos(); return;
  }

  const hb = e.target.closest("[data-hor]");
  if(hb){ dia(S.ui.fecha).horario = hb.dataset.hor; guardar(); reRenderConservandoAbiertos(); return; }

  if(e.target.closest("#btnPesoOk")){
    const v = $("#inPeso").value;
    dia(S.ui.fecha).peso = v==="" ? null : Math.max(0, parseFloat(v.replace(",",".")) || 0);
    if(dia(S.ui.fecha).peso === null) delete dia(S.ui.fecha).peso;
    guardar(); toast("Peso guardado"); reRenderConservandoAbiertos(); return;
  }

  if(e.target.closest("#btnPasosOk")){
    const v = $("#inPasos").value;
    dia(S.ui.fecha).pasos = v===""?null:Math.max(0,parseInt(v,10)||0);
    guardar(); toast("Pasos guardados"); reRenderConservandoAbiertos(); return;
  }

  /* --- ansiedad --- */
  if(e.target.closest("#btnAnsAdd")){
    episodios(S.ui.fecha).push({ h:horaAhora(), nivel:null, disp:null, salida:null, nota:"" });
    guardar(); reRenderConservandoAbiertos(); return;
  }
  const abo = e.target.closest("[data-ansdel]");
  if(abo){
    episodios(S.ui.fecha).splice(+abo.dataset.ansdel, 1);
    guardar(); reRenderConservandoAbiertos(); return;
  }
  const anv = e.target.closest("[data-ansniv]");
  if(anv){
    const [i,id] = anv.dataset.ansniv.split("|");
    const ep = episodios(S.ui.fecha)[+i]; if(!ep) return;
    ep.nivel = ep.nivel===id ? null : id;
    guardar(); reRenderConservandoAbiertos(); return;
  }
  const adi = e.target.closest("[data-ansdisp]");
  if(adi){
    const [i,j] = adi.dataset.ansdisp.split("|");
    const ep = episodios(S.ui.fecha)[+i]; if(!ep) return;
    const txt = S.plan.ansiedad.disparadores[+j];
    ep.disp = ep.disp===txt ? null : txt;
    guardar(); reRenderConservandoAbiertos(); return;
  }
  const asa = e.target.closest("[data-anssal]");
  if(asa){
    const [i,id] = asa.dataset.anssal.split("|");
    const ep = episodios(S.ui.fecha)[+i]; if(!ep) return;
    ep.salida = ep.salida===id ? null : id;
    guardar(); reRenderConservandoAbiertos(); return;
  }

  /* --- adherencia --- */
  if(e.target.closest("#btnRepetirDia")){
    const ant = ultimoDiaIgual(S.ui.fecha); if(!ant) return;
    if(diaTieneDatos(S.ui.fecha) && !confirm("Ya tienes comidas apuntadas hoy. ¿Reemplazarlas por las del "+fechaLarga(ant).toLowerCase()+"?")) return;
    copiarDia(S.ui.fecha, ant); toast("Día copiado"); reRenderConservandoAbiertos(); return;
  }
  const rc = e.target.closest("[data-repcom]");
  if(rc){ const [mid,f] = rc.dataset.repcom.split("|");
    copiarComida(S.ui.fecha, mid, f); toast("Comida copiada"); reRenderConservandoAbiertos(); return; }

  const fv = e.target.closest("[data-fav]");
  if(fv){ const [mid,i] = fv.dataset.fav.split("|");
    aplicarFav(S.ui.fecha, mid, +i); toast("Favorito aplicado"); reRenderConservandoAbiertos(); return; }

  const gf = e.target.closest("[data-guardarfav]");
  if(gf){
    const mid = gf.dataset.guardarfav;
    const n = prompt("Nombre para esta combinación:", "Mi " + mid);
    if(n && n.trim()){ guardarFav(S.ui.fecha, mid, n.trim().slice(0,24)); toast("Guardado"); reRenderConservandoAbiertos(); }
    return;
  }
  const bf = e.target.closest("[data-borrarfav]");
  if(bf){ const [mid,i] = bf.dataset.borrarfav.split("|");
    borrarFav(mid, +i); renderAjustes(); return; }

  const st = e.target.closest("[data-sint]");
  if(st){ const [mid,val] = st.dataset.sint.split("|");
    const d = dia(S.ui.fecha); d.sintomas = d.sintomas||{};
    d.sintomas[mid] = d.sintomas[mid]===val ? undefined : val;
    if(!d.sintomas[mid]) delete d.sintomas[mid];
    guardar(); reRenderConservandoAbiertos(); return; }

  if(e.target.closest("#btnHoraAhora")){
    const n = new Date();
    dia(S.ui.fecha).horaCena = dosDig(n.getHours())+":"+dosDig(n.getMinutes());
    guardar(); reRenderConservandoAbiertos(); return;
  }

  if(e.target.closest("#btnICS")){
    const blob = new Blob([generarICS()], {type:"text/calendar;charset=utf-8"});
    const a = document.createElement("a"); a.href = URL.createObjectURL(blob);
    a.download = "recordatorios-"+S.plan.cliente.toLowerCase()+".ics"; a.click();
    toast("Ábrelo para añadirlo al calendario"); return;
  }

  if(e.target.closest("#btnResumen")){
    $("#outResumen").value = generarResumen();
    $("#outResumen").classList.remove("hidden"); $("#btnCopiar").classList.remove("hidden"); return;
  }
  if(e.target.closest("#btnCopiar")){
    const ta=$("#outResumen"); ta.select();
    if(navigator.clipboard) navigator.clipboard.writeText(ta.value).then(()=>toast("Copiado"),()=>document.execCommand("copy"));
    else { document.execCommand("copy"); toast("Copiado"); }
    return;
  }
  if(e.target.closest("#btnExport")){
    const blob = new Blob([JSON.stringify({log:S.log},null,1)],{type:"application/json"});
    const a=document.createElement("a"); a.href=URL.createObjectURL(blob);
    a.download="registros-"+S.plan.cliente.toLowerCase()+"-"+hoyISO()+".json"; a.click(); return;
  }
  if(e.target.closest("#btnImport")){ $("#fileImport").click(); return; }
  if(e.target.closest("#btnReset")){
    if(confirm("¿Borrar TODOS los registros de comidas, entrenos y pasos? Los valores del plan se conservan.")){
      S.log = {}; guardar(); render(); toast("Registros borrados");
    } return;
  }
});

function reRenderConservandoAbiertos(){
  const abiertos = $$("#v-hoy details.meal[open]").map(d=>d.dataset.meal);
  const acc = $$("#v-hoy details.acc[open]").length;
  const y = window.scrollY;
  renderHoy();
  abiertos.forEach(id=>{ const el=$(`#v-hoy details.meal[data-meal="${id}"]`); if(el) el.open=true; });
  if(acc) $$("#v-hoy details.acc").forEach(d=>d.open=true);
  window.scrollTo(0,y);
}

document.addEventListener("input", e=>{
  const st = e.target.closest("[data-set]");
  if(st){
    const [did,ex,se,campo] = st.dataset.set.split("|");
    const s = sesion(S.ui.fecha, did);
    if(!s[ex]) s[ex] = [];
    if(!s[ex][se]) s[ex][se] = {};
    s[ex][se][campo] = st.value;
    st.classList.toggle("done", !!st.value);
    guardar(); actualizarStatsEntreno(); return;
  }
  if(e.target.id==="libreFiltro"){ S.ui.libreFiltro = e.target.value; aplicarFiltroLibre(); return; }
  if(e.target.id==="libreNota"){ dia(S.ui.fecha).libreNota = e.target.value; guardar(); return; }
  if(e.target.id==="inHoraCena"){ dia(S.ui.fecha).horaCena = e.target.value; guardar(); return; }
  if(e.target.id==="notaDia"){ dia(S.ui.fecha).nota = e.target.value; guardar(); return; }
  if(e.target.id==="inPeso"){
    const v = e.target.value;
    if(v==="") delete dia(S.ui.fecha).peso;
    else dia(S.ui.fecha).peso = Math.max(0, parseFloat(v.replace(",",".")) || 0);
    guardar(); return;
  }
  if(e.target.id==="inPasos"){
    const v=e.target.value; dia(S.ui.fecha).pasos = v===""?null:Math.max(0,parseInt(v,10)||0); guardar(); return;
  }
  const an = e.target.closest && e.target.closest("[data-ansnota]");
  if(an){ const ep = episodios(S.ui.fecha)[+an.dataset.ansnota]; if(ep){ ep.nota = an.value; guardar(); } return; }
  const ah = e.target.closest && e.target.closest("[data-anshora]");
  if(ah){ const ep = episodios(S.ui.fecha)[+ah.dataset.anshora]; if(ep){ ep.h = ah.value; guardar(); } return; }
});

document.addEventListener("change", e=>{
  /* la hora de la cena repinta al confirmarla, para que el aviso salga al momento */
  if(e.target.id==="inHoraCena"){
    dia(S.ui.fecha).horaCena = e.target.value; guardar(); reRenderConservandoAbiertos(); return;
  }
  if(e.target.id==="fileImport" && e.target.files[0]){
    const fr=new FileReader();
    fr.onload=()=>{ try{
      const d=JSON.parse(fr.result);
      if(d.log) S.log=d.log;
      guardar(); render(); toast("Copia restaurada");
    }catch(err){ alert("El archivo no es válido."); } };
    fr.readAsText(e.target.files[0]);
  }
});

/* --- blur en entreno: dispara descanso automático si se rellenan las reps --- */
document.addEventListener("blur", e=>{
  const st = e.target.closest && e.target.closest("[data-set]");
  if(st && st.dataset.set.endsWith("|reps") && st.value){
    const btn = st.closest(".ex") && st.closest(".ex").querySelector("[data-rest]");
    if(btn && !$("#timer").classList.contains("on")) arrancarTimer(+btn.dataset.rest);
  }
}, true);

/* --- instalación como app (PWA) --- */
window.addEventListener("beforeinstallprompt", ev => {
  ev.preventDefault(); window.__pwaPrompt = ev;
  if(S.ui.vista==="ajustes") renderAjustes();
});
document.addEventListener("click", e=>{
  if(e.target.closest("#btnInstalar")){
    if(window.__pwaPrompt){ window.__pwaPrompt.prompt(); window.__pwaPrompt = null; }
    else toast("Usa el menú del navegador para añadirla");
  }
});
if("serviceWorker" in navigator && location.protocol.startsWith("http")){
  window.addEventListener("load", ()=> navigator.serviceWorker.register("sw.js").catch(()=>{}));
}

cargar();
render();
</script>
